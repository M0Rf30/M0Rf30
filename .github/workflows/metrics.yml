name: "Profile"

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/metrics.yml"
      - "README.md"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/metrics.yml"
      - "README.md"

permissions: {}

concurrency:
  group: "profile-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
      - name: "Setup Node"
        uses: "actions/setup-node@v7"
        with:
          node-version: "22"
      - name: "Run unit tests"
        run: "node --test '.github/scripts/test/*.test.mjs'"
      - name: "Render fixture cards"
        run: |
          node .github/scripts/generate.mjs \
            --fixture .github/scripts/test/fixtures/profile.json \
            --out "${{ runner.temp }}/out" \
            --no-readme

  generate:
    name: "Generate"
    needs: "test"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
      - name: "Setup Node"
        uses: "actions/setup-node@v7"
        with:
          node-version: "22"
      - name: "Collect data and render cards"
        run: "node .github/scripts/generate.mjs"
        env:
          GITHUB_TOKEN: "${{ secrets.METRICS_TOKEN }}"
      - name: "Commit and push"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- metrics README.md)" ]; then
            git add -A metrics README.md
            git commit -m "[skip ci] Update profile cards"
            git push
          fi
